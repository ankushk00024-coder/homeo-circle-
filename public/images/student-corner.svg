<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Illustration of an open textbook, graduation cap and botanical sprigs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDF4EF"/>
      <stop offset="1" stop-color="#E2F0FA"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F7FC"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172B46"/>
      <stop offset="1" stop-color="#0B1726"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#139B94"/>
      <stop offset="1" stop-color="#0D817B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="640" cy="120" r="150" fill="#BCE8E0" opacity=".45"/>
  <circle cx="120" cy="520" r="180" fill="#C9E2F4" opacity=".5"/>
  <g fill="#0D817B" opacity=".18">
    <circle cx="90" cy="90" r="4"/><circle cx="130" cy="70" r="3"/><circle cx="700" cy="480" r="5"/>
    <circle cx="730" cy="430" r="3"/><circle cx="560" cy="540" r="4"/><circle cx="250" cy="110" r="3"/>
  </g>
  <!-- left sprig -->
  <g transform="translate(150 430) rotate(-20)">
    <path d="M0 0 C 10 -80 40 -160 90 -230" stroke="#0D817B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M22 -70 C -20 -90 -40 -130 -30 -160 C 5 -140 25 -110 22 -70Z" fill="url(#leaf)"/>
    <path d="M40 -120 C 85 -130 110 -165 110 -195 C 75 -185 50 -160 40 -120Z" fill="#139B94" opacity=".85"/>
    <path d="M65 -175 C 30 -200 25 -235 35 -260 C 65 -240 75 -210 65 -175Z" fill="url(#leaf)" opacity=".9"/>
  </g>
  <!-- right sprig -->
  <g transform="translate(650 440) rotate(18) scale(-1 1)">
    <path d="M0 0 C 10 -70 35 -140 80 -200" stroke="#344A78" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M20 -60 C -18 -80 -34 -115 -26 -140 C 6 -122 24 -96 20 -60Z" fill="#4A6296" opacity=".55"/>
    <path d="M38 -110 C 78 -118 100 -150 100 -176 C 68 -168 46 -146 38 -110Z" fill="#344A78" opacity=".45"/>
  </g>
  <!-- shadow -->
  <ellipse cx="400" cy="470" rx="230" ry="22" fill="#122238" opacity=".12"/>
  <!-- open book -->
  <g>
    <path d="M400 300 C 330 270 240 268 175 285 L 175 455 C 240 440 330 442 400 470 Z" fill="url(#page)" stroke="#D7E5F0" stroke-width="3"/>
    <path d="M400 300 C 470 270 560 268 625 285 L 625 455 C 560 440 470 442 400 470 Z" fill="url(#page)" stroke="#D7E5F0" stroke-width="3"/>
    <path d="M400 300 L 400 470" stroke="#C4D7E6" stroke-width="3"/>
    <g stroke="#9BB8D0" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8">
      <path d="M215 320 C 270 310 320 312 370 328"/>
      <path d="M215 350 C 270 340 320 342 370 358"/>
      <path d="M215 380 C 270 370 320 372 370 388"/>
      <path d="M215 410 C 255 402 290 403 325 412"/>
    </g>
    <!-- repertory chart on right page -->
    <g transform="translate(445 318)">
      <rect width="140" height="100" rx="10" fill="#EEF6FC"/>
      <rect x="16" y="56" width="18" height="30" rx="4" fill="#0D817B"/>
      <rect x="46" y="36" width="18" height="50" rx="4" fill="#139B94"/>
      <rect x="76" y="20" width="18" height="66" rx="4" fill="#344A78"/>
      <rect x="106" y="44" width="18" height="42" rx="4" fill="#4A6296" opacity=".7"/>
    </g>
  </g>
  <!-- graduation cap -->
  <g transform="translate(400 200)">
    <path d="M-150 0 L 0 -62 L 150 0 L 0 62 Z" fill="url(#cap)"/>
    <path d="M-92 26 L -92 82 C -50 112 50 112 92 82 L 92 26 L 0 62 Z" fill="#172B46"/>
    <path d="M110 8 L 110 92" stroke="#13B5A9" stroke-width="5" stroke-linecap="round"/>
    <circle cx="110" cy="100" r="11" fill="#13B5A9"/>
    <circle cx="0" cy="0" r="9" fill="#13B5A9"/>
  </g>
  <!-- sparkles -->
  <g fill="#13B5A9">
    <path d="M610 230 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M205 225 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity=".7"/>
  </g>
</svg>
